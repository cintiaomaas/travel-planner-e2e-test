name: CI - Playwright E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  E2E_BASE_URL: https://meu-travel-planner.vercel.app/
  E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}

jobs:
  e2e:
    name: Testes E2E no Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Baixar projeto de testes
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências dos testes
        run: npm ci

      - name: Instalar Google Chrome para o Playwright
        run: npx playwright install --with-deps chrome

      - name: Aguardar aplicação
        shell: bash
        run: |
          for attempt in {1..60}; do
            if curl --fail --location --silent --show-error \
              https://meu-travel-planner.vercel.app/login > /dev/null; then
              exit 0
            fi
            sleep 2
          done

          exit 1

      - name: Executar testes E2E
        run: npm run test:e2e

      - name: Publicar relatório e evidências
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
